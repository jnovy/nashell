# Nash SearXNG settings — bind-mounted into the container at /etc/searxng/
#
# This minimal override file uses use_default_settings: true to inherit
# all SearXNG defaults, then enables JSON API format (required by nash).
#
# Location at runtime: ~/.nash/searxng/settings.yml
# The file is auto-generated by nash if missing, but you can customize it.
# See https://docs.searxng.org/admin/settings/settings.html for all options.

use_default_settings: true

search:
  formats:
    - html
    - json

server:
  secret_key: "nash-searxng-auto-generated-key"
